<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QSD 4-Simplex: The Engine of Time</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030308;
    color: #e0ddd5;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  canvas { display: block; }

  .overlay {
    position: absolute;
    pointer-events: none;
    z-index: 10;
  }

  .title-block {
    top: 24px; left: 32px;
  }

  .title-block h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #f0ece4;
    line-height: 1.1;
  }

  .title-block .subtitle {
    font-size: 11px;
    font-weight: 300;
    color: #7a7668;
    margin-top: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .info-panel {
    bottom: 24px; left: 32px;
    background: rgba(3, 3, 8, 0.75);
    border: 1px solid rgba(120, 110, 90, 0.2);
    border-radius: 2px;
    padding: 16px 20px;
    backdrop-filter: blur(8px);
    min-width: 280px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
    font-size: 12px;
    font-weight: 300;
  }

  .info-label {
    color: #7a7668;
    letter-spacing: 0.06em;
  }

  .info-value {
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .info-value.code { color: #c9a84c; }
  .info-value.anchor { color: #e85d4a; }
  .info-value.cycle { color: #4a9ee8; }

  .anchor-indicator {
    top: 24px; right: 32px;
    text-align: right;
  }

  .anchor-label {
    font-size: 10px;
    color: #7a7668;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .anchor-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 600;
    color: #e85d4a;
    line-height: 1;
    transition: opacity 0.3s;
  }

  .anchor-role {
    font-size: 11px;
    color: #9a8e7a;
    margin-top: 2px;
  }

  .cycle-display {
    bottom: 24px; right: 32px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .cycle-node {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    border: 1.5px solid rgba(120, 110, 90, 0.3);
    background: rgba(3, 3, 8, 0.6);
    transition: all 0.4s ease;
  }

  .cycle-node.active {
    border-color: #e85d4a;
    background: rgba(232, 93, 74, 0.15);
    color: #e85d4a;
    box-shadow: 0 0 12px rgba(232, 93, 74, 0.3);
  }

  .cycle-arrow {
    color: #4a4438;
    font-size: 14px;
  }

  .controls {
    bottom: 100px; right: 32px;
    pointer-events: all;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ctrl-btn {
    width: 36px; height: 36px;
    border: 1px solid rgba(120, 110, 90, 0.25);
    border-radius: 2px;
    background: rgba(3, 3, 8, 0.7);
    color: #9a8e7a;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
    font-family: inherit;
  }

  .ctrl-btn:hover {
    border-color: #c9a84c;
    color: #c9a84c;
  }

  .speed-label {
    font-size: 9px;
    color: #5a5448;
    text-align: center;
    letter-spacing: 0.06em;
  }

  .phase-bar {
    top: 50%; right: 32px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .phase-pip {
    width: 3px;
    height: 16px;
    background: rgba(120, 110, 90, 0.15);
    border-radius: 1px;
    transition: background 0.3s;
  }

  .phase-pip.lit {
    background: rgba(74, 158, 232, 0.6);
    box-shadow: 0 0 6px rgba(74, 158, 232, 0.3);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Title -->
<div class="overlay title-block">
  <h1>The Engine of Time</h1>
  <div class="subtitle">4-Simplex · [[5,1,3]] Quantum Error-Correcting Code</div>
</div>

<!-- Current Anchor -->
<div class="overlay anchor-indicator">
  <div class="anchor-label">Current Anchor</div>
  <div class="anchor-name" id="anchor-name">q₁</div>
  <div class="anchor-role">Watchman (Error Observer)</div>
</div>

<!-- Info Panel -->
<div class="overlay info-panel">
  <div class="info-row">
    <span class="info-label">Code</span>
    <span class="info-value code">[[5, 1, 3]]</span>
  </div>
  <div class="info-row">
    <span class="info-label">Physical qubits</span>
    <span class="info-value">5 (K₅ simplex)</span>
  </div>
  <div class="info-row">
    <span class="info-label">Bulk qubits</span>
    <span class="info-value">4 (K₄ tetrahedron)</span>
  </div>
  <div class="info-row">
    <span class="info-label">Anchor</span>
    <span class="info-value anchor" id="anchor-id">q₁</span>
  </div>
  <div class="info-row">
    <span class="info-label">Cycle phase</span>
    <span class="info-value cycle" id="cycle-phase">0 / 5</span>
  </div>
  <div class="info-row">
    <span class="info-label">Symmetry</span>
    <span class="info-value">ℤ₅ (C₅ Pentagon)</span>
  </div>
  <div class="info-row">
    <span class="info-label">Hb₄</span>
    <span class="info-value">1/(4 ln 2) = 0.3607</span>
  </div>
</div>

<!-- C5 Cycle indicator -->
<div class="overlay cycle-display" id="cycle-display"></div>

<!-- Controls -->
<div class="overlay controls">
  <button class="ctrl-btn" id="btn-faster" title="Faster">+</button>
  <div class="speed-label" id="speed-label">1.0×</div>
  <button class="ctrl-btn" id="btn-slower" title="Slower">−</button>
  <div style="height: 8px;"></div>
  <button class="ctrl-btn" id="btn-pause" title="Pause/Play">⏸</button>
</div>

<!-- Phase bar -->
<div class="overlay phase-bar" id="phase-bar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  // ─── CONSTANTS ──────────────────────────────────────
  const NODE_NAMES = ['q₁', 'q₂', 'q₃', 'q₄', 'q₅'];
  const BULK_COLOR = 0x4a9ee8;   // Blue for bulk nodes
  const ANCHOR_COLOR = 0xe85d4a; // Red-orange for anchor
  const EDGE_BULK = 0x2a5a8a;   // Dim blue for bulk edges
  const EDGE_ANCHOR = 0x8a3a2a; // Dim red for anchor edges
  const GLOW_ANCHOR = 0xe85d4a;
  const BG_COLOR = 0x030308;

  // 4-Simplex vertices using Z₅ parameterization in 4D
  // v_k = (cos(2πk/5), sin(2πk/5), cos(4πk/5), sin(4πk/5))
  // This ensures all pairwise distances are equal and Z₅ rotation is trivial
  const BASE_VERTS_4D = [];
  for (let k = 0; k < 5; k++) {
    const a1 = 2 * Math.PI * k / 5;
    const a2 = 4 * Math.PI * k / 5;
    BASE_VERTS_4D.push([Math.cos(a1), Math.sin(a1), Math.cos(a2), Math.sin(a2)]);
  }

  // All 10 edges of K₅
  const EDGES = [];
  for (let i = 0; i < 5; i++)
    for (let j = i + 1; j < 5; j++)
      EDGES.push([i, j]);

  // ─── STATE ──────────────────────────────────────────
  let speed = 1.0;
  let paused = false;
  let theta = 0;
  let currentAnchor = 0;

  // ─── THREE.JS SETUP ────────────────────────────────
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG_COLOR);
  scene.fog = new THREE.FogExp2(BG_COLOR, 0.06);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.5, 5.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Ambient + directional light
  scene.add(new THREE.AmbientLight(0x404040, 0.5));
  const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
  dirLight.position.set(5, 5, 5);
  scene.add(dirLight);

  // ─── NODE MESHES ────────────────────────────────────
  const nodeMeshes = [];
  const nodeGlows = [];
  const nodeLabels = []; // We'll use sprites

  for (let i = 0; i < 5; i++) {
    // Core sphere
    const geo = new THREE.SphereGeometry(0.12, 32, 32);
    const mat = new THREE.MeshPhongMaterial({
      color: BULK_COLOR,
      emissive: BULK_COLOR,
      emissiveIntensity: 0.3,
      shininess: 80
    });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    nodeMeshes.push(mesh);

    // Glow shell
    const glowGeo = new THREE.SphereGeometry(0.22, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({
      color: BULK_COLOR,
      transparent: true,
      opacity: 0.08,
      side: THREE.BackSide
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glow);
    nodeGlows.push(glow);
  }

  // ─── EDGE LINES ─────────────────────────────────────
  const edgeLines = [];
  for (let e = 0; e < EDGES.length; e++) {
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(6); // 2 points × 3 coords
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({
      color: EDGE_BULK,
      transparent: true,
      opacity: 0.35,
      linewidth: 1
    });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    edgeLines.push(line);
  }

  // ─── BACKGROUND STARS ───────────────────────────────
  const starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(600);
  for (let i = 0; i < 600; i++) {
    starPositions[i] = (Math.random() - 0.5) * 40;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMat = new THREE.PointsMaterial({ color: 0x3a3830, size: 0.03, sizeAttenuation: true });
  scene.add(new THREE.Points(starGeo, starMat));

  // ─── SUBTLE GRID RING (equator reference) ──────────
  const ringGeo = new THREE.RingGeometry(2.8, 2.82, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x1a1810,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -0.5;
  scene.add(ring);

  // ─── 4D → 3D PROJECTION ────────────────────────────
  function project4Dto3D(v4, theta) {
    // Apply double rotation: 
    //   (x1, y1) rotated by theta
    //   (x2, y2) rotated by 2*theta
    const c1 = Math.cos(theta), s1 = Math.sin(theta);
    const c2 = Math.cos(2 * theta), s2 = Math.sin(2 * theta);

    const x1 = v4[0] * c1 - v4[1] * s1;
    const y1 = v4[0] * s1 + v4[1] * c1;
    const x2 = v4[2] * c2 - v4[3] * s2;
    const y2 = v4[2] * s2 + v4[3] * c2;

    // Perspective projection from 4D: use y2 as the 4th dimension
    const perspDist = 4.0;
    const w = y2;
    const scale = perspDist / (perspDist - w * 0.6);

    return {
      x: x1 * scale * 1.5,
      y: x2 * scale * 1.5,
      z: y1 * scale * 1.5,
      w: w,
      scale: scale
    };
  }

  // ─── UI SETUP ───────────────────────────────────────
  // Cycle display
  const cycleDiv = document.getElementById('cycle-display');
  for (let i = 0; i < 5; i++) {
    if (i > 0) {
      const arrow = document.createElement('span');
      arrow.className = 'cycle-arrow';
      arrow.textContent = '→';
      cycleDiv.appendChild(arrow);
    }
    const node = document.createElement('div');
    node.className = 'cycle-node';
    node.id = `cycle-${i}`;
    node.textContent = (i + 1);
    cycleDiv.appendChild(node);
  }

  // Phase bar
  const phaseBar = document.getElementById('phase-bar');
  const NUM_PIPS = 25;
  for (let i = 0; i < NUM_PIPS; i++) {
    const pip = document.createElement('div');
    pip.className = 'phase-pip';
    pip.id = `pip-${i}`;
    phaseBar.appendChild(pip);
  }

  // Controls
  document.getElementById('btn-faster').addEventListener('click', () => {
    speed = Math.min(speed + 0.25, 3.0);
    document.getElementById('speed-label').textContent = speed.toFixed(1) + '×';
  });
  document.getElementById('btn-slower').addEventListener('click', () => {
    speed = Math.max(speed - 0.25, 0.25);
    document.getElementById('speed-label').textContent = speed.toFixed(1) + '×';
  });
  document.getElementById('btn-pause').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('btn-pause').textContent = paused ? '▶' : '⏸';
  });

  // ─── CAMERA ORBIT (mouse drag) ─────────────────────
  let isDragging = false;
  let prevMouse = { x: 0, y: 0 };
  let cameraAngleX = 0;
  let cameraAngleY = 0.1;

  renderer.domElement.addEventListener('mousedown', (e) => {
    isDragging = true;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', () => { isDragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = (e.clientX - prevMouse.x) * 0.005;
    const dy = (e.clientY - prevMouse.y) * 0.005;
    cameraAngleX += dx;
    cameraAngleY = Math.max(-1.2, Math.min(1.2, cameraAngleY + dy));
    prevMouse = { x: e.clientX, y: e.clientY };
  });

  // Touch support
  renderer.domElement.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  window.addEventListener('touchend', () => { isDragging = false; });
  window.addEventListener('touchmove', (e) => {
    if (!isDragging || e.touches.length !== 1) return;
    const dx = (e.touches[0].clientX - prevMouse.x) * 0.005;
    const dy = (e.touches[0].clientY - prevMouse.y) * 0.005;
    cameraAngleX += dx;
    cameraAngleY = Math.max(-1.2, Math.min(1.2, cameraAngleY + dy));
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  // ─── ANIMATION LOOP ─────────────────────────────────
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const dt = clock.getDelta();
    if (!paused) {
      // Full cycle = 2π, one watchman period = 2π/5
      theta += dt * speed * 0.4;
    }

    // Determine current anchor: the node closest to the "center" in projection
    // In our Z₅ parameterization, the anchor cycles every 2π/5 in theta
    const cyclePhase = ((theta % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    const anchorIndex = Math.floor(cyclePhase / (2 * Math.PI / 5)) % 5;

    // Project all vertices
    const projected = [];
    let minW = Infinity, maxW = -Infinity;
    for (let i = 0; i < 5; i++) {
      const p = project4Dto3D(BASE_VERTS_4D[i], theta);
      projected.push(p);
      if (p.w < minW) minW = p.w;
      if (p.w > maxW) maxW = p.w;
    }

    // Find actual anchor: the node most "interior" (smallest scale / most negative w)
    let actualAnchor = 0;
    let minScale = Infinity;
    for (let i = 0; i < 5; i++) {
      if (projected[i].w < minScale) {
        minScale = projected[i].w;
        actualAnchor = i;
      }
    }

    if (actualAnchor !== currentAnchor) {
      currentAnchor = actualAnchor;
    }

    // Update node positions and appearances
    for (let i = 0; i < 5; i++) {
      const p = projected[i];
      const pos = new THREE.Vector3(p.x, p.y, p.z);
      nodeMeshes[i].position.copy(pos);
      nodeGlows[i].position.copy(pos);

      const isAnchor = (i === currentAnchor);

      // Smooth transition for size based on w-coordinate
      const wNorm = (p.w - minW) / (maxW - minW + 0.001); // 0 = deepest, 1 = furthest
      const baseRadius = 0.10 + wNorm * 0.06;
      const anchorBonus = isAnchor ? 0.05 + 0.02 * Math.sin(theta * 5) : 0;

      nodeMeshes[i].scale.setScalar((baseRadius + anchorBonus) / 0.12);

      // Color
      const targetColor = isAnchor ? ANCHOR_COLOR : BULK_COLOR;
      nodeMeshes[i].material.color.lerp(new THREE.Color(targetColor), 0.08);
      nodeMeshes[i].material.emissive.lerp(new THREE.Color(targetColor), 0.08);
      nodeMeshes[i].material.emissiveIntensity = isAnchor ? 0.6 : 0.2;

      // Glow
      nodeGlows[i].scale.setScalar((baseRadius + anchorBonus + 0.1) / 0.22);
      nodeGlows[i].material.color.lerp(new THREE.Color(targetColor), 0.08);
      nodeGlows[i].material.opacity = isAnchor ? 0.18 + 0.05 * Math.sin(theta * 5) : 0.05;
    }

    // Update edges
    for (let e = 0; e < EDGES.length; e++) {
      const [i, j] = EDGES[e];
      const pi = projected[i], pj = projected[j];
      const positions = edgeLines[e].geometry.attributes.position.array;
      positions[0] = pi.x; positions[1] = pi.y; positions[2] = pi.z;
      positions[3] = pj.x; positions[4] = pj.y; positions[5] = pj.z;
      edgeLines[e].geometry.attributes.position.needsUpdate = true;

      const isAnchorEdge = (i === currentAnchor || j === currentAnchor);
      const targetEdgeColor = isAnchorEdge ? EDGE_ANCHOR : EDGE_BULK;
      edgeLines[e].material.color.lerp(new THREE.Color(targetEdgeColor), 0.08);
      edgeLines[e].material.opacity = isAnchorEdge ? 0.55 : 0.25;
    }

    // Camera orbit
    const camDist = 5.5;
    camera.position.x = camDist * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
    camera.position.y = camDist * Math.sin(cameraAngleY);
    camera.position.z = camDist * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
    camera.lookAt(0, 0, 0);

    // ─── UI UPDATES ──────────────────────
    // Anchor name
    document.getElementById('anchor-name').textContent = NODE_NAMES[currentAnchor];
    document.getElementById('anchor-id').textContent = NODE_NAMES[currentAnchor];

    // Cycle phase
    const phaseInCycle = ((cyclePhase / (2 * Math.PI / 5)) % 1);
    document.getElementById('cycle-phase').textContent = 
      `${currentAnchor + 1} / 5  (${(phaseInCycle * 100).toFixed(0)}%)`;

    // Cycle nodes
    for (let i = 0; i < 5; i++) {
      const el = document.getElementById(`cycle-${i}`);
      if (i === currentAnchor) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    }

    // Phase pips
    const pipProgress = cyclePhase / (2 * Math.PI);
    for (let i = 0; i < NUM_PIPS; i++) {
      const pipPhase = i / NUM_PIPS;
      const el = document.getElementById(`pip-${i}`);
      if (pipPhase <= pipProgress) {
        el.classList.add('lit');
      } else {
        el.classList.remove('lit');
      }
    }

    renderer.render(scene, camera);
  }

  // ─── RESIZE ─────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>
</body>
</html>
